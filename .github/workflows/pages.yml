name: Deploy ClassConnect to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check app JavaScript
        run: |
          python3 - <<'PY'
          html = open('index.html', encoding='utf-8').read()
          start = html.index('<script type="module">') + len('<script type="module">')
          end = html.index('</script>', start)
          open('/tmp/classconnect.mjs', 'w', encoding='utf-8').write(html[start:end])
          PY
          node --check /tmp/classconnect.mjs
          python3 -m json.tool manifest.webmanifest > /dev/null
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
